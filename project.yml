name: Melt
options:
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: Config/Melt.xcconfig
  Release: Config/Melt.xcconfig
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Melt:
    type: application
    platform: iOS
    sources: [Melt]
    dependencies:
      - package: ConvexMobile
    info:
      path: Melt/Info.plist
      properties:
        CFBundleDisplayName: Friday
        CFBundleName: Friday
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ConvexDeploymentURL: $(CONVEX_DEPLOYMENT_URL)
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prabaljitwalia.melt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: [MeltUITests]
  MeltUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MeltUITests]
    dependencies:
      - target: Melt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prabaljitwalia.melt.uitests
        GENERATE_INFOPLIST_FILE: YES
