name: Melt
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Melt.xcconfig
  Release: Config/Melt.xcconfig
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.2
targets:
  Melt:
    type: application
    platform: iOS
    sources: [Melt]
    dependencies:
      - package: ConvexMobile
    info:
      path: Melt/Info.plist
      properties:
        CFBundleDisplayName: Melt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ConvexDeploymentURL: $(CONVEX_DEPLOYMENT_URL)
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prabaljitwalia.melt
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
